services:
  - type: web
    name: urbe-streetwear
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: URBE_SECRET_KEY
        generateValue: true
      # Contraseña del panel: la genera Render y se consulta en Environment.
      # No escribirla aquí: este repositorio es público.
      - key: URBE_PANEL_PASSWORD
        generateValue: true
